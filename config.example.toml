# Example only. The installer stores the active config at .research-store/config.toml.
[store]
documents = "knowledge/documents"
conversations = "knowledge/conversations"
assets = "knowledge/assets"
state = ".research-store/library.sqlite"
temporary = ".research-store/tmp"

# Register any number of existing folders or individual PDF files. They are
# always treated as read-only and must be outside this project.
[[sources]]
id = "documents"
path = "~/Documents"
kind = "directory"
enabled = true

