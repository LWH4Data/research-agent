[project]
name = "research-store"
version = "0.2.0"
description = "Incremental read-only PDF and conversation research library for Codex"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=6.0",
]

[project.scripts]
research-store = "research_store.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_store"]
